name: A13 Build and Publish

on:
  push:
    branches: [iwsdk-migration]
    paths:
      - ".github/workflows/a13-build-publish.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A13
        uses: actions/checkout@v4
        with:
          ref: iwsdk-migration
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install IWSDK dependencies
        working-directory: iwsdk
        run: npm install

      - name: Typecheck A13
        working-directory: iwsdk
        run: npm run typecheck

      - name: Build A13
        working-directory: iwsdk
        run: npm run build

      - name: Publish A13 preview into main
        shell: bash
        run: |
          git fetch origin main
          git worktree add /tmp/nexus-main origin/main
          rm -rf /tmp/nexus-main/iwsdk-preview
          mkdir -p /tmp/nexus-main/iwsdk-preview
          cp -R iwsdk/dist/. /tmp/nexus-main/iwsdk-preview/
          cd /tmp/nexus-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iwsdk-preview
          if git diff --cached --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git commit -m "Publish IWSDK A13 preview"
          git push origin HEAD:main
