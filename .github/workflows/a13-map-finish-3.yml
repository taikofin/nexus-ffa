name: A13 Map Finish Patch 3

on:
  push:
    branches: [iwsdk-migration]
    paths:
      - ".github/workflows/a13-map-finish-3.yml"

permissions:
  contents: write

jobs:
  patch-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: iwsdk-migration
          fetch-depth: 0

      - name: Apply A13 patch
        run: python .github/a13_patch.py

      - name: Commit A13 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iwsdk/src/index.ts
          git commit -m "IWSDK A13: add map finish structure and clutter pass"
          git push origin HEAD:iwsdk-migration
