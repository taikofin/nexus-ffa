<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#061019">
<title>NEXUS v23 — Wall Stunt Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061019;color:white;font-family:Arial,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#fresh{position:fixed;z-index:10;left:50%;top:10px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:#ffcf57;color:#111;font-weight:900;font-size:13px;letter-spacing:.08em;pointer-events:none}
#status{position:fixed;z-index:5;left:12px;top:54px;padding:8px 10px;border-radius:10px;background:#061019dd;border:1px solid #61f5ff88;font-size:12px;line-height:1.4;pointer-events:none}
#status b{color:#61f5ff}
#version{position:fixed;right:10px;bottom:8px;z-index:5;font-size:10px;opacity:.85;pointer-events:none}
#hud{position:fixed;left:12px;top:116px;z-index:4;font-size:12px;text-shadow:0 2px 6px #000;pointer-events:none}
.xrbtn{position:fixed!important;left:50%!important;bottom:26px!important;transform:translateX(-50%)!important;width:auto!important;height:auto!important;padding:14px 22px!important;border-radius:999px!important;border:0!important;background:#61f5ff!important;color:#051118!important;font:900 17px Arial!important}
</style>
</head>
<body>
<div id="fresh">FRESH FILE · v23</div>
<div id="status"><b>NEXUS v23 WALL STUNT</b><br>Flip into a building face to attach. Slow slide → fast slide → locked roll-off. Right controller upside-down during a flip tosses the test gun.</div>
<div id="hud">BANK <b id="score">0</b>/30 · CARRY <b id="carry">0</b> · <span id="weapon">FINGER GUNS + TEST GUN</span></div>
<div id="version">NEXUS v23 · WALL STUNT / TEST PROP</div>
<script type="module" src="./nexus-v23.js"></script>
</body>
</html>
